name: I0 and I1 validation

on:
  push:
    branches: [feature/i0-contract-foundation, feature/i1-graph-anatomy]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -m dgca_next --version
      - run: python -m dgca_next verify-specs
      - run: python -m pytest -q --basetemp=.pytest-tmp -rs
      - run: python -m pytest -q --basetemp=.pytest-tmp
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - name: Check tracked and untracked cleanliness after validation
        shell: python
        run: |
          import subprocess
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          assert not status, status
